
<!DOCTYPE html>
<html>
<head>
    <title>jQuery DOM Operations</title>

    <!-- Import jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        .myStyle {
            background-color: coral;
            padding: 16px;
        }
    </style>
</head>
<body>

    <h2>jQuery DOM Operations</h2>

    <div id="myElement">Original Text</div>

    <br>

    <div id="myDIV">
        <p>I am a myDIV.</p>
    </div>

    <br>

    <button id="myButton">Click me</button>

    <script>

        // a. Change text using jQuery
        $("#myElement").text("Modified Text");

        // b. Add CSS class using jQuery
        $("#myDIV").addClass("myStyle");

        // c. Add click event using jQuery
        $("#myButton").click(function() {
            alert("Button clicked!");
        });

    </script>

</body>
</html>
